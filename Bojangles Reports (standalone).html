  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2235a626-b489-4297-be1a-a70021be8b54\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   Altametrics Back Office — Color Tokens\n   Sampled directly from product screenshots.\n   ============================================================ */\n:root {\n  /* --- Brand red (logo, Help, destructive/alert) --- */\n  --red-50:  #fdeaeb;\n  --red-100: #f7c4c7;\n  --red-500: #de202b;   /* primary Altametrics red */\n  --red-600: #c81d27;\n  --red-700: #a8161e;\n\n  /* --- Dark chrome (sidebar, top bar, tabs) --- */\n  --chrome-950: #1a1c26;\n  --chrome-900: #292b37;   /* sidebar + top bar background */\n  --chrome-800: #21232e;   /* active tab */\n  --chrome-700: #3a3c4a;\n  --chrome-600: #535562;   /* inactive tab text/hover */\n\n  /* --- Deep navy (section / module headers, e.g. \"Start of Day\") --- */\n  --navy-900: #0b0b3b;\n  --navy-800: #14144f;\n  --navy-700: #1e1e6b;\n\n  /* --- Blue (primary actions, links, GO button) --- */\n  --blue-50:  #e8f0f7;\n  --blue-100: #c3d9ec;\n  --blue-500: #2c6fad;   /* primary action / link */\n  --blue-600: #245d92;\n  --blue-700: #1c4a76;\n\n  /* --- Steel blue (flat module buttons: Cash & Sales, Forecast, ...) --- */\n  --steel-400: #6a90b3;\n  --steel-500: #4b6d90;   /* module button body (flat) */\n  --steel-600: #3a5675;   /* module button pressed */\n  --steel-700: #2c4259;\n  --navy-icon: #10253f;   /* dark icon square inside module buttons */\n\n  /* --- Green (success badges, completed tasks, status locks) --- */\n  --green-50:  #e9f6ea;\n  --green-500: #36b447;   /* task badge / locked-complete */\n  --green-400: #6ec358;   /* progress bar */\n  --green-600: #2c9a3c;\n\n  /* --- Purple (date / period selector) --- */\n  --purple-400: #7a6390;\n  --purple-700: #523f67;\n  --purple-900: #3f2a56;\n\n  /* --- KPI metric cards (gray gradient stack) --- */\n  --kpi-header: #737373;  /* title band */\n  --kpi-row-1:  #969696;  /* lighter value row */\n  --kpi-row-2:  #505050;  /* darker value row */\n\n  /* --- Amber / warning (negative variance highlight) --- */\n  --amber-500: #e6a700;\n  --warn-text: #c0392b;   /* negative / parenthesized figures */\n\n  /* --- Neutrals (surfaces, tables, borders, text) --- */\n  --white:     #ffffff;\n  --gray-50:   #f7f7f7;\n  --gray-100:  #f0f0f0;\n  --gray-150:  #ececec;   /* table header fill */\n  --gray-200:  #e2e2e2;\n  --gray-300:  #dddddd;   /* borders / rules */\n  --gray-400:  #c4c4c4;\n  --gray-500:  #9b9b9b;\n  --gray-600:  #6e6e6e;\n  --gray-700:  #4a4a4a;\n  --gray-800:  #333333;\n  --gray-900:  #1f1f1f;\n  --black:     #000000;   /* workflow connector lines */\n\n  /* ============================================================\n     Semantic aliases — prefer these in components.\n     ============================================================ */\n  --surface-app:        var(--gray-100);   /* outer app canvas */\n  --surface-content:    var(--white);      /* main content panel */\n  --surface-card:       var(--white);\n  --surface-rail:       var(--chrome-900); /* sidebar / topbar */\n  --surface-toolbar:    var(--gray-150);   /* filter / control strip */\n  --surface-table-head: var(--gray-150);\n  --surface-stripe:     var(--gray-50);\n\n  --border-default:     var(--gray-300);\n  --border-strong:      var(--gray-400);\n  --border-input:       var(--gray-400);\n\n  --text-primary:       var(--gray-900);\n  --text-secondary:     var(--gray-600);\n  --text-muted:         var(--gray-500);\n  --text-on-dark:       var(--white);\n  --text-link:          var(--blue-500);\n  --text-link-strong:   var(--blue-700);\n  --text-negative:      var(--warn-text);\n\n  --blue-action:        #015683;          /* GO / primary action button */\n  --blue-action-hov:    #01486e;\n  --action-primary:     var(--blue-action);\n  --action-primary-hov: var(--blue-action-hov);\n  --action-danger:      var(--red-500);\n  --action-danger-hov:  var(--red-600);\n\n  --status-success:     var(--green-500);\n  --status-progress:    var(--green-400);\n  --accent-brand:       var(--red-500);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Altametrics Back Office — Typography Tokens\n   The product uses a classic web-safe sans stack (Arial /\n   Helvetica). No custom webfont ships with the app, so these\n   tokens reference system fonts for pixel-faithful output.\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-sans: Arial, \"Helvetica Neue\", Helvetica, \"Segoe UI\", sans-serif;\n  --font-mono: \"Consolas\", \"SFMono-Regular\", Menlo, Monaco, monospace;\n\n  /* Semantic family aliases */\n  --font-ui:      var(--font-sans);   /* labels, nav, buttons */\n  --font-body:    var(--font-sans);   /* body / table text */\n  --font-data:    var(--font-sans);   /* numeric figures (tabular) */\n  --font-heading: var(--font-sans);\n\n  /* --- Size scale (px-based, dense enterprise UI) --- */\n  --text-2xs: 10px;\n  --text-xs:  11px;   /* dense table cells, meta */\n  --text-sm:  12px;   /* default table body / labels */\n  --text-base:13px;   /* base UI text */\n  --text-md:  14px;   /* nav items, buttons */\n  --text-lg:  16px;   /* card values, sub-headers */\n  --text-xl:  18px;   /* section titles */\n  --text-2xl: 20px;   /* page / panel titles */\n  --text-3xl: 24px;   /* big metric figures */\n\n  /* --- Weights --- */\n  --weight-regular: 400;\n  --weight-medium:  600;\n  --weight-bold:    700;\n\n  /* --- Line heights --- */\n  --leading-tight:  1.15;\n  --leading-snug:   1.3;\n  --leading-normal: 1.45;\n\n  /* --- Letter spacing --- */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Altametrics Back Office — Spacing & Layout Tokens\n   Tight, grid-dense enterprise spacing (4px base unit).\n   ============================================================ */\n:root {\n  /* --- Spacing scale (4px base) --- */\n  --space-0:  0;\n  --space-1:  2px;\n  --space-2:  4px;\n  --space-3:  6px;\n  --space-4:  8px;\n  --space-5:  10px;\n  --space-6:  12px;\n  --space-8:  16px;\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-16: 32px;\n  --space-20: 40px;\n\n  /* --- Component sizing --- */\n  --control-h-sm: 26px;\n  --control-h:    32px;   /* inputs, buttons, GO */\n  --control-h-lg: 38px;\n\n  --row-h:        38px;   /* table row */\n  --row-h-dense:  30px;\n\n  /* --- Layout chrome --- */\n  --sidebar-w:        220px;  /* expanded sidebar */\n  --sidebar-w-rail:   54px;   /* collapsed icon rail */\n  --topbar-h:         50px;\n  --module-btn-h:     56px;   /* steel 3D nav buttons */\n  --kpi-card-w:       148px;\n  --content-pad:      16px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Altametrics Back Office — Elevation, Radius & Borders\n   The product is a flat, legacy enterprise UI: small radii,\n   crisp 1px borders, subtle outer shadows, and beveled\n   gradient buttons (inset highlight + drop shadow).\n   ============================================================ */\n:root {\n  /* --- Corner radii (minimal — this is a square, dense UI) --- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   3px;   /* buttons, inputs, cards */\n  --radius-md:   4px;\n  --radius-pill: 999px; /* Help pill, status chips */\n\n  /* --- Borders --- */\n  --border-hairline: 1px solid var(--gray-300);\n  --border-control:  1px solid var(--gray-400);\n  --border-table:    1px solid var(--gray-300);\n\n  /* --- Shadows --- */\n  --shadow-none:  none;\n  --shadow-card:  0 1px 2px rgba(0,0,0,0.12);          /* content panels */\n  --shadow-panel: 0 1px 4px rgba(0,0,0,0.18);          /* floating dropdowns/menus */\n  --shadow-pop:   0 2px 8px rgba(0,0,0,0.22);          /* dialogs */\n\n  /* Beveled 3D button (steel module buttons & KPI cards):\n     top inset highlight + bottom drop shadow */\n  --bevel-up:   inset 0 1px 0 rgba(255,255,255,0.28), 0 1px 2px rgba(0,0,0,0.35); /* @kind shadow */\n  --bevel-down: inset 0 2px 4px rgba(0,0,0,0.35); /* @kind shadow */\n\n  /* Focus ring (Bootstrap-era glow) */\n  --focus-ring: 0 0 0 3px rgba(44,111,173,0.35);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Altametrics Back Office — Base / reset\n   Element defaults that establish the dense enterprise baseline.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-primary);\n  background: var(--surface-app);\n  -webkit-font-smoothing: antialiased;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n/* Tabular figures for numeric/financial data */\n.ab-num,\n.ab-tabular {\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* Negative / parenthesized financial values */\n.ab-negative { color: var(--text-negative); }\n<\u002Fstyle>\n<style>/* ============================================================\n   Altametrics Back Office — Design System\n   Root stylesheet. Consumers link THIS file only.\n   Keep this file as an @import manifest — no rules inline.\n   ============================================================ */\n/* ============================================================\n   Altametrics Back Office — Color Tokens\n   Sampled directly from product screenshots.\n   ============================================================ */\n:root {\n  /* --- Brand red (logo, Help, destructive/alert) --- */\n  --red-  buttons, GO */\n  --control-h-lg: 38px;\n\n  --row-h:        38px;   /* table row */\n  --row-h-dense:  30px;\n\n  /* --- Layout chrome --- */\n  --sidebar-w:        220px;  /* expanded sidebar */\n  --sidebar-w-rail:   54px;   /* collapsed icon rail */\n  --topbar-h:         50px;\n  --module-btn-h:     56px;   /* steel 3D nav buttons */\n  --kpi-card-w:       148px;\n  --content-pad:      16px;\n}\n\n/* ============================================================\n   Altametrics Back Office — Elevation, Radius & Borders\n   The product is a flat, legacy enterprise UI: small radii,\n   crisp 1px borders, subtle outer shadows, and beveled\n   gradient buttons (inset highlight + drop shadow).\n   ============================================================ */\n:root {\n  /* --- Corner radii (minimal — this is a square, dense UI) --- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   3px;   /* buttons, inputs, cards */\n  --radius-md:   4px;\n  --radius-pill: 999px; /* Help pill, status chips */\n\n  /* --- Borders --- */\n  --border-hairline: 1px solid var(--gray-300);\n  --border-control:  1px solid var(--gray-400);\n  --border-table:    1px solid var(--gray-300);\n\n  /* --- Shadows --- */\n  --shadow-none:  none;\n  --shadow-card:  0 1px 2px rgba(0,0,0,0.12);          /* content panels */\n  --shadow-panel: 0 1px 4px rgba(0,0,0,0.18);          /* floating dropdowns/menus */\n  --shadow-pop:   0 2px 8px rgba(0,0,0,0.22);          /* dialogs */\n\n  /* Beveled 3D button (steel module buttons & KPI cards):\n     top inset highlight + bottom drop shadow */\n  --bevel-up:   inset 0 1px 0 rgba(255,255,255,0.28), 0 1px 2px rgba(0,0,0,0.35); /* @kind shadow */\n  --bevel-down: inset 0 2px 4px rgba(0,0,0,0.35); /* @kind shadow */\n\n  /* Focus ring (Bootstrap-era glow) */\n  --focus-ring: 0 0 0 3px rgba(44,111,173,0.35);\n}\n\n/* ============================================================\n   Altametrics Back Office — Base / reset\n   Element defaults that establish the dense enterprise baseline.\n   ============================================================ */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-primary);\n  background: var(--surface-app);\n  -webkit-font-smoothing: antialiased;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n/* Tabular figures for numeric/financial data */\n.ab-num,\n.ab-tabular {\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\" 1;\n}\n\n/* Negative / parenthesized financial values */\n.ab-negative { color: var(--text-negative); }\n\n<\u002Fstyle>\n<script src=\"b8bd6f29-6dc7-4f09-a735-771554029e5d\"><\u002Fscript>\n<script src=\"f1f1da0d-d039-412f-a6f9-c7326fd1af19\"><\u002Fscript>\n<script src=\"45d77ecc-7c10-421e-bd09-4a5eb7314806\"><\u002Fscript>\n<script src=\"25dd89a9-dc12-4555-8975-4f73d15ae73c\"><\u002Fscript>\n<script src=\"192ce9a6-7647-4ede-9b49-e77f6db82070\"><\u002Fscript>\n<style>\n  html, body { margin:0; padding:0; background:#f0f0f0; }\n  body { font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#1f1f1f; }\n  a { color:#2c6fad; text-decoration:none; }\n  a:hover { color:#1c4a76; text-decoration:underline; }\n  select, input, button { font-family: Arial, Helvetica, sans-serif; }\n  select[multiple] option { padding:3px 6px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#f0f0f0;\">\n\n  <div style=\"height:50px; background:#292b37; display:flex; align-items:center; padding:0 16px;\">\n    <div sc-camel-on-click=\"{{ onToggleSidebar }}\" title=\"Toggle menu\" style=\"width:20px; height:16px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer;\">\n      <span style=\"display:block; height:2px; background:#ffffff;\"><\u002Fspan>\n      <span style=\"display:bl       <\u002Fsc-raw-select>\n              <\u002Fsc-if>\n              <span style=\"font-size:11.5px;\">at<\u002Fspan>\n              <input type=\"time\" value=\"{{ dTime }}\" sc-camel-on-change=\"{{ onDTime }}\" style=\"width:110px; font-size:11.5px; border:1px solid #c4c4c4; border-radius:2px; padding:3px 6px;\">\n              <span style=\"font-size:10.5px; color:#6e6e6e;\">EST<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"font-weight:700; font-size:11.5px;\">Format<\u002Fdiv>\n            <sc-raw-select value=\"{{ dFormat }}\" sc-camel-on-change=\"{{ onDFormat }}\" style=\"width:140px; font-size:11.5px; border:1px solid #c4c4c4; border-radius:2px; padding:4px 6px; background:#fff;\">\n              <option value=\"PDF\">PDF<\u002Foption>\n              <option value=\"Excel\">Excel<\u002Foption>\n              <option value=\"HTML\">HTML<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ modalError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin:12px 16px 0; background:#fdeaeb; border:1px solid #f7c4c7; color:#a8161e; font-size:11.5px; padding:7px 10px; border-radius:2px;\">{{ modalError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; align-items:center; gap:10px; padding:14px 16px; margin-top:8px; border-top:1px solid #dddddd; background:#f7f7f7;\">\n          <span style=\"font-size:10.5px; color:#6e6e6e;\">{{ modalSummary }}<\u002Fspan>\n          <div style=\"margin-left:auto; display:flex; gap:8px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onModalClose }}\" style=\"background:#f0f0f0; color:#333; border:1px solid #c4c4c4; border-radius:2px; font-size:11.5px; font-weight:700; padding:8px 15px; cursor:pointer;\" style-hover=\"background:#e2e2e2;\">Cancel<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onModalSave }}\" style=\"background:#015683; color:#fff; border:none; border-radius:2px; font-size:11.5px; font-weight:700; padding:8px 18px; cursor:pointer;\" style-hover=\"background:#01486e;\">{{ modalSaveLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultInterval&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:52,&quot;section&quot;:&quot;Qualifiers&quot;},&quot;pdfColumnLimit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:24,&quot;section&quot;:&quot;Export&quot;},&quot;reportTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dynamic Inventory Metric Report&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Report&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    var iv = this.props.defaultInterval || 7;\n    this.state = {\n      loaded:false, fileMeta:\"No file uploaded.\", rows:[], metricCols:[], storeList:[], categoryList:[],\n      ingredientList:[], freqList:[], catToIng:{}, dateMin:\"\", dateMax:\"\",\n      freq:\"Daily\", intervalCount:iv, intervalUnit:\"Day\", customRange:false,\n      from:\"\", to:\"\", metric:\"\", selStores:[], selCats:[], selIngs:[],\n      storeQ:\"\", catQ:\"\", ingQ:\"\", hideZero:true,\n      banner:null, model:null, collapsed:{},\n      schedules:[], draft:null, editingId:null, modalError:\"\",\n      screen:\"dimr\", sidebarOpen:false, sidebarHover:false,\n      cLoaded:false, cFileMeta:\"No file uploaded.\", cRows:[], xRows:[], xStoreList:[], xLedger:null,\n      cStoreList:[], cCatList:[], aRows:[], aStoreList:[], aModel:null,\n      cStoreQ:\"\", cCatQ:\"\", cFromQ:\"\", cToQ:\"\", cFromStore:\"\", cToStore:\"\",\n      cDateMin:\"\", cDateMax:\"\", cFreq:\"Weekly Combined\", cSelStores:[], cSelCats:[], cFrom:\"\", cTo:\"\",\n      cModel:null, cCollapsed:{}, cBanner:null\n    };\n  }\n\n  componentDidMount(){\n    var saved = [];\n    try { saved = JSON.parse(window.localStorage.getItem(\"dimr.schedules\") || \"[]\"); } catch(e){ saved = []; }\n    this.setState({ schedules: Array.isArray(saved) ? saved : [] });\n    this.loadSample(true);\n    this.cogsLoadSample();\n    this.avtLoadSample();\n  }\n\n  /* ---------- helpers ---------- */\n  pad2(n){ return (\"0\"+n).slice(-2); }\n  isoOf(v){\n    if(!v) return \"\";\n    var s=String(v).trim(), m=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n    if(m) return m[1]+\"-\"+m[2]+\"-\"+m[3];\n    m=s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/);\n    if(m) return m[3]+\"-\"+(\"0\"+m[1]).slice(-2)+\"-\"+(\"0\"+m[2]).slice(-2);\n    return \"\";\n  }\n  usOf(iso){ if(!iso) return \"\"; var p=iso.split(\"-\"); return p[1]+\"/\"+p[2]+\"/\"+p[0]; }\n  toUTC(iso){ var p=iso.split(\"-\"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }\n  fromUTC(ms){ var d=new Date(ms); return d.getUTCFullYear()+\"-\"+this.pad2(d.getUTCMonth()+1)+\"-\"+this.pad2(d.getUTCDate()); }\n  weekEnding(iso){ var ms=this.toUTC(iso), dow=new Date(ms).getUTCDay(); return this.fromUTC(ms + ((0-dow+7)%7)*86400000); }\n  monthEnding(iso){ var p=iso.split(\"-\"), y=+p[0], m=+p[1]; return y+\"-\"+this.pad2(m)+\"-\"+this.pad2(new Date(Date.UTC(y,m,0)).getUTCDate()); }\n  periodOf(iso){\n    var we=this.weekEnding(iso), y=+we.slice(0,4);\n    var firstWE=this.weekEnding(y+\"-01-01\");\n    var weeks=Math.floor((this.toUTC(we)-this.toUTC(firstWE))/(7*86400000));\n    if(weeks<0){ y-=1; firstWE=this.weekEnding(y+\"-01-01\"); weeks=Math.floor((this.toUTC(we)-this.toUTC(firstWE))/(7*86400000)); }\n    var pIdx=Math.floor(weeks/4);\n    var endIso=this.fromUTC(this.toUTC(firstWE)+((pIdx+1)*4-1)*7*86400000);\n    return { key:y+\"-P\"+this.pad2(pIdx+1), sort:endIso, label:\"P\"+(pIdx+1)+\" \"+y };\n  }\n  bucketOf(freq, iso){\n    var MON=[\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\n    if(!iso) return { key:\"(no date)\", sort:\"9999-12-31\", label:\"(no date)\" };\n    if(freq===\"Daily\") return { key:iso, sort:iso, label:this.usOf(iso) };\n    if(freq===\"Weekly\"){ var we=this.weekEnding(iso); return { key:we, sort:we, label:\"W/E \"+this.usOf(we) }; }\n    if(freq===\"Monthly\"){ var me=this.monthEnding(iso), p=me.split(\"-\"); return { key:me, sort:me, label:MON[+p[1]-1]+\" \"+p[0] }; }\n    if(freq===\"Period\") return this.periodOf(iso);\n    return { key:iso, sort:iso, label:this.usOf(iso) };\n  }\n  num(v){ if(v===null||v===undefined||v===\"\") return 0; var n=parseFloat(String(v).replace(/,/g,\"\")); return isNaN(n)?0:n; }\n  fmt(n){ return n.toLocaleString(\"en-US\",{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  storeSort(a,b){ var na=parseFloat(a), nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb)) return na-nb; return a<b?-1:(a>b?1:0); }\n  stamp(){ var d=new Date(); return \"\"+d.getFullYear()+this.pad2(d.getMonth()+1)+this.pad2(d.getDate())+\"_\"+this.pad2(d.getHours())+this.pad2(d.getMinutes()); }\n  fileName(ext){ return \"Dynamic_Inventory_Metric_Report_\"+this.stamp()+\".\"+ext; }\n  generatedTime(){\n    var d=new Date();\n    return d.toLocaleDateString(\"en-US\",{month:\"2-digit\",day:\"2-digit\",year:\"numeric\"})+\" \"+\n           d.toLocaleTimeString(\"en-US\",{hour:\"2-digit\",minute:\"2-digit\",hour12:true});\n  }\n  isPctMetric(m){ return /%/.test(String(m||\"\")); }\n  /* Growth v prior: % metrics -> percentage-point difference; $ / qty metrics -> % change */\n  growthOf(vals, nCols, metric){\n    if(nCols<2) return { text:\"\\u2014\", v:null };\n    var cur=vals[0], prior=vals[1]; // columns are newest-first\n    if(cur===undefined || prior===undefined) return { text:\"\\u2014\", v:null };\n    if(this.isPctMetric(metric)){\n      var d=cur-prior;\n      return { text:(d>0?\"+\":\"\")+d.toFixed(2)+\" pp\", v:d };\n    }\n    if(prior===0) return { text:\"\\u2014\", v:null };\n    var g=(cur-prior)/prior*100;\n    return { text:(g>0?\"+\":\"\")+g.toFixed(2)+\"%\", v:g };\n  }\n  intervalDays(count, unit){ return unit===\"Day\" ? count : (unit===\"Week\" ? count*7 : count*28); }\n  fromForInterval(toIso, count, unit){\n    if(!toIso) return \"\";\n    return this.fromUTC(this.toUTC(toIso) - (this.intervalDays(count,unit)-1)*86400000);\n  }\n\n  /* ---------- sample data ---------- */\n  loadSample(silent){\n    var regions={ \"West Region\":[\"1018\",\"1042\",\"1077\"], \"Southeast Region\":[\"2011\",\"2034\",\"2056\"] };\n    var cats={ \"Produce\":[\"Romaine Lettuce\",\"Roma Tomato\",\"Yellow Onion\"],\n               \"Dairy\":[\"Shredded Cheese\",\"Butter Solids\",\"Whole Milk\"],\n               \"Proteins\":[\"Beef Patty 4oz\",\"Chicken Fillet\",\"Applewood Bacon\"],\n               \"Dry Goods\":[\"Bun 4in\",\"Fry Case 6/6\",\"Napkin Case\"] };\n    var seed=20260802, rnd=function(){ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };\n    var end=Date.UTC(2026,7,2), days=56, rows=[], itemId=1000, ids={};\n    var self=this;\n    Object.keys(cats).forEach(function(c){ cats[c].forEach(function(i){ ids[i]=\"ITM-\"+(itemId++); }); });\n\n    for(var d=days-1; d>=0; d--){\n      var iso=this.fromUTC(end-d*86400000);\n      Object.keys(regions).forEach(function(region){\n        regions[region].forEach(function(store){\n          Object.keys(cats).forEach(function(cat){\n            cats[cat].forEach(function(item){\n              var actual=18+rnd()*220, theo=actual*(0.88+rnd()*0.22);\n              rows.push({\n                \"Store\":store, \"Region\":region, \"Inventory Date\":self.usOf(iso), \"Count Frequency\":\"Daily\",\n                \"Minor Item Category\":cat, \"Item ID\":ids[item], \"Item Desc\":item,\n                \"Actual $\":actual.toFixed(2), \"Theo $\":theo.toFixed(2),\n                \"Variance $\":(actual-theo).toFixed(2), \"Waste $\":(rnd()*14).toFixed(2),\n                \"Usage Qty\":(rnd()*45).toFixed(2)\n              });\n            });\n          });\n        });\n      });\n    }\n    // weekly rollup rows (separate dataset, same shape)\n    var wk={};\n    rows.forEach(function(r){\n      var we=self.weekEnding(self.isoOf(r[\"Inventory Date\"]));\n      var k=r[\"Store\"]+\"|\"+r[\"Item Desc\"]+\"|\"+we;\n      if(!wk[k]) wk[k]={ base:r, we:we, a:0, t:0, v:0, w:0, q:0 };\n      var b=wk[k];\n      b.a+=parseFloat(r[\"Actual $\"]); b.t+=parseFloat(r[\"Theo $\"]);\n      b.v+=parseFloat(r[\"Variance $\"]); b.w+=parseFloat(r[\"Waste $\"]); b.q+=parseFloat(r[\"Usage Qty\"]);\n    });\n    Object.keys(wk).forEach(function(k){\n      var b=wk[k], r=b.base;\n      rows.push({\n        \"Store\":r[\"Store\"], \"Region\":r[\"Region\"], \"Inventory Date\":self.usOf(b.we), \"Count Frequency\":\"Weekly\",\n        \"Minor Item Category\":r[\"Minor Item Category\"], \"Item ID\":r[\"Item ID\"], \"Item Desc\":r[\"Item Desc\"],\n        \"Actual $\":b.a.toFixed(2), \"Theo $\":b.t.toFixed(2), \"Variance $\":b.v.toFixed(2),\n        \"Waste $\":b.w.toFixed(2), \"Usage Qty\":b.q.toFixed(2)\n      });\n    });\n    this.ingest(rows, \"Sample dataset (6 stores \\u00b7 12 ingredients \\u00b7 8 weeks)\", silent);\n  }\n\n  /* ---------- ingest ---------- */\n  ingest(rows, label, silent){\n    var self=this;\n    var FIXED=[\"Store\",\"Region\",\"Inventory Date\",\"Count Frequency\",\"Minor Item Category\",\"Item ID\",\"Item Desc\"];\n    var headers=Object.keys(rows[0]||{});\n    var missing=FIXED.filter(function(c){ return headers.indexOf(c)<0; });\n    var data=rows.filter(function(r){ return r[\"Store\"]!==undefined && r[\"Store\"]!==\"\"; });\n    if(!data.length){ this.setState({ banner:{t:\"error\", m:\"No rows with a Store value were found.\"} }); return; }\n\n    var metricCols=headers.filter(function(h){ return FIXED.indexOf(h)<0 && h!==\"S No.\" && String(h).trim()!==\"\"; });\n
