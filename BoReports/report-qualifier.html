<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Actual Food Cost Report | BoReports</title>
<style>
  :root{
    --sidebar-bg:#101a2b;
    --sidebar-icon:#8b96ab;
    --sidebar-icon-active:#ffffff;
    --header-bg:#ffffff;
    --breadcrumb-bg:#eef1f5;
    --border:#d7dce3;
    --panel-header-bg:#e9ebee;
    --text:#2c333a;
    --text-muted:#6b7280;
    --accent:#1f6fb2;
    --accent-dark:#175a91;
    --help-red:#e0392c;
    --link:#2f6fa8;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    color:var(--text);
    background:#f4f5f7;
  }

  .app{
    display:flex;
    min-height:100vh;
  }

  /* Sidebar */
  .sidebar{
    width:52px;
    background:var(--sidebar-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 0;
    gap:26px;
    flex-shrink:0;
  }
  .sidebar .menu-btn{
    color:var(--sidebar-icon-active);
    cursor:pointer;
    margin-bottom:6px;
  }
  .sidebar .icon{
    width:22px;
    height:22px;
    color:var(--sidebar-icon);
    cursor:pointer;
    transition:color .15s ease;
  }
  .sidebar .icon:hover,
  .sidebar .icon.active{
    color:var(--sidebar-icon-active);
  }

  /* Main column */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* Top header */
  .topbar{
    height:52px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:18px;
    padding:0 20px;
  }
  .help-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--help-red);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .topbar .icon-btn{
    width:20px;
    height:20px;
    color:#555f6b;
    cursor:pointer;
  }

  /* Breadcrumb */
  .breadcrumb{
    background:var(--breadcrumb-bg);
    border-bottom:1px solid var(--border);
    padding:8px 20px;
    font-size:13px;
    color:var(--text-muted);
  }
  .breadcrumb a{
    color:var(--link);
    text-decoration:none;
  }
  .breadcrumb a:hover{ text-decoration:underline; }
  .breadcrumb .sep{ margin:0 6px; color:#a6adb8; }
  .breadcrumb .current{ color:var(--text); font-weight:600; }

  /* Content */
  .content{
    flex:1;
    padding:24px;
  }

  .qualifier-panel{
    max-width:1200px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }

  .panel-header{
    background:var(--panel-header-bg);
    text-align:center;
    padding:10px 16px;
    font-weight:700;
    font-size:14px;
    letter-spacing:.2px;
    border-bottom:1px solid var(--border);
  }

  .qualifier-row{
    display:flex;
    align-items:flex-start;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    gap:20px;
  }
  .qualifier-row:last-of-type{
    border-bottom:none;
  }

  .qualifier-label{
    width:170px;
    flex-shrink:0;
    font-weight:600;
    font-size:13.5px;
    padding-top:7px;
  }

  .qualifier-field{
    flex:1;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }

  select,
  input[type="text"]{
    font-family:inherit;
    font-size:13px;
    padding:6px 10px;
    border:1px solid #b9c0c9;
    border-radius:3px;
    background:#fff;
    color:var(--text);
  }
  select:focus,
  input:focus{
    outline:2px solid rgba(31,111,178,.35);
    border-color:var(--accent);
  }

  select.freq-select{
    min-width:220px;
  }
  select.cat-select{
    min-width:320px;
  }
  select.calendar-select{
    min-width:190px;
  }

  .store-list{
    width:320px;
    height:96px;
    overflow-y:auto;
    border:1px solid #b9c0c9;
    border-radius:3px;
    background:#fff;
    font-size:13px;
  }
  .store-list ul{
    list-style:none;
    margin:0;
    padding:0;
  }
  .store-list li{
    padding:3px 10px;
    color:var(--link);
    cursor:pointer;
    white-space:nowrap;
  }
  .store-list li:hover{
    background:#eef4fa;
  }
  .store-list li.selected{
    background:#dceafb;
  }

  .date-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .date-group label.inline{
    font-size:13px;
    color:var(--text-muted);
    font-weight:600;
  }
  .date-input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .date-input-wrap input{
    width:130px;
    padding-right:30px;
  }
  .date-input-wrap .cal-icon{
    position:absolute;
    right:6px;
    width:18px;
    height:18px;
    color:#4a5561;
    background:#eef0f2;
    border:1px solid #b9c0c9;
    border-radius:2px;
    padding:2px;
    cursor:pointer;
  }

  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .checkbox-row input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:var(--accent);
    cursor:pointer;
  }

  .actions-row{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:20px;
    flex-wrap:wrap;
  }

  .btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:3px;
    padding:9px 18px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn:hover{
    background:var(--accent-dark);
  }
  .btn:active{
    transform:translateY(1px);
  }

  @media (max-width:720px){
    .qualifier-row{ flex-direction:column; }
    .qualifier-label{ width:auto; padding-top:0; }
    .store-list{ width:100%; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <nav class="sidebar" aria-label="Primary navigation">
    <svg class="menu-btn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Home"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Schedules"><rect x="3" y="5" width="18" height="15" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Operations"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1a4 4 0 0 1-5 5L6.5 20.5a2 2 0 0 1-3-3L12.8 8.2a4 4 0 0 1 5-5z"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Employees"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/><path d="M17 11a3 3 0 1 0 0-6"/><path d="M23 20c0-2.5-2-4.2-4.5-4.8"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Reports"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Documents"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="User Settings"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Help"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.4 1-1.4 1.9"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
  </nav>

  <div class="main">

    <!-- Top bar -->
    <header class="topbar">
      <button class="help-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.4 1-1.4 1.9"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
        Help
      </button>
      <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Search"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="My Apps"><rect x="3" y="3" width="6" height="6"/><rect x="9.5" y="3" width="6" height="6"/><rect x="16" y="3" width="6" height="6"/><rect x="3" y="9.5" width="6" height="6"/><rect x="9.5" y="9.5" width="6" height="6"/><rect x="16" y="9.5" width="6" height="6"/><rect x="3" y="16" width="6" height="6"/><rect x="9.5" y="16" width="6" height="6"/><rect x="16" y="16" width="6" height="6"/></svg>
      <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Notifications"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Account"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="#">BoReports</a><span class="sep">&gt;</span>
      <a href="#">Single Store Report</a><span class="sep">&gt;</span>
      <a href="#">Food Cost</a><span class="sep">&gt;</span>
      <span class="current">Actual Food Cost Report</span>
      <span style="margin-left:6px; color:#8a929c;">| (User: CorpAdmin@altametrics.com)</span>
    </div>

    <!-- Content -->
    <main class="content">
      <form class="qualifier-panel" id="qualifierForm">
        <div class="panel-header">Qualifiers</div>

        <div class="qualifier-row">
          <label class="qualifier-label" for="countFrequency">Select Count Frequency</label>
          <div class="qualifier-field">
            <select id="countFrequency" class="freq-select" name="countFrequency">
              <option value="">Select From List</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="periodic">Periodic</option>
            </select>
          </div>
        </div>

        <div class="qualifier-row">
          <label class="qualifier-label" for="userStore">User Store</label>
          <div class="qualifier-field">
            <div class="store-list" id="userStore" role="listbox" aria-multiselectable="true" tabindex="0">
              <ul>
                <li role="option" data-value="001">001, Alta Test store</li>
                <li role="option" data-value="1016">1016, Waynesville</li>
                <li role="option" data-value="1018">1018, Eden</li>
                <li role="option" data-value="1029">1029, Chesterfield</li>
                <li role="option" data-value="1032">1032, Hendersonville</li>
                <li role="option" data-value="1044">1044, Brevard</li>
              </ul>
            </div>
          </div>
        </div>

        <div class="qualifier-row">
          <span class="qualifier-label">Date</span>
          <div class="qualifier-field">
            <div class="date-group">
              <label class="inline" for="dateFrom">From</label>
              <div class="date-input-wrap">
                <input type="text" id="dateFrom" name="dateFrom" value="09/28/2026" />
                <svg class="cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
              </div>
              <label class="inline" for="dateTo">To</label>
              <div class="date-input-wrap">
                <input type="text" id="dateTo" name="dateTo" value="09/28/2026" />
                <svg class="cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
              </div>
              <select id="calendarPreset" class="calendar-select" name="calendarPreset">
                <option value="">Select From Calendar</option>
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
                <option value="this_week">This Week</option>
                <option value="last_week">Last Week</option>
                <option value="this_period">This Period</option>
                <option value="last_period">Last Period</option>
              </select>
            </div>
          </div>
        </div>

        <div class="qualifier-row">
          <label class="qualifier-label" for="majorCat">Select Major Cat</label>
          <div class="qualifier-field">
            <select id="majorCat" class="cat-select" name="majorCat">
              <option value="">Please Select a Major Category</option>
              <option value="food">Food</option>
              <option value="beverage">Beverage</option>
              <option value="paper">Paper</option>
              <option value="supplies">Supplies</option>
            </select>
          </div>
        </div>

        <div class="qualifier-row">
          <span class="qualifier-label">Hide zero rows</span>
          <div class="qualifier-field">
            <div class="checkbox-row">
              <input type="checkbox" id="hideZeroRows" name="hideZeroRows" checked />
            </div>
          </div>
        </div>

        <div class="actions-row">
          <button type="submit" class="btn" data-format="pdf">Generate PDF</button>
          <button type="submit" class="btn" data-format="html">Generate HTML</button>
          <button type="submit" class="btn" data-format="csv">Generate CSV</button>
          <button type="submit" class="btn" data-format="formatted-csv">Generate Formatted CSV</button>
        </div>
      </form>
    </main>

  </div>
</div>

<script>
  // Multi-select behavior for the User Store list box (ctrl/cmd + click to toggle, click to select).
  const storeList = document.getElementById('userStore');
  storeList.querySelectorAll('li').forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (!e.ctrlKey && !e.metaKey) {
        storeList.querySelectorAll('li.selected').forEach(function (li) { li.classList.remove('selected'); });
      }
      item.classList.toggle('selected');
    });
  });

  // Report generation submit handler.
  const form = document.getElementById('qualifierForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const format = e.submitter ? e.submitter.dataset.format : 'pdf';
    const selectedStores = Array.from(storeList.querySelectorAll('li.selected')).map(function (li) {
      return li.dataset.value;
    });
    const payload = {
      countFrequency: document.getElementById('countFrequency').value,
      stores: selectedStores,
      dateFrom: document.getElementById('dateFrom').value,
      dateTo: document.getElementById('dateTo').value,
      calendarPreset: document.getElementById('calendarPreset').value,
      majorCat: document.getElementById('majorCat').value,
      hideZeroRows: document.getElementById('hideZeroRows').checked,
      format: format
    };
    console.log('Generate report request:', payload);
  });
</script>
</body>
</html>
